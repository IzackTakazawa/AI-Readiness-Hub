services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    labels:
      base44.project: "Web"
      base44.kind: "web"
      base44.port: "3000"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: python:3.12-slim
    restart: on-failure
    ports:
      - "8000:8000"
    labels:
      base44.project: "API"
      base44.kind: "api"
      base44.port: "8000"
      base44.docs: "/docs"
    volumes:
      - ./backend:/app
      - api_data:/app/data
    working_dir: /app
    command: ["sh", "-ec", "pip install --quiet --no-cache-dir -r requirements.txt && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  api_data:
